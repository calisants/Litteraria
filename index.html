<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f3d7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mots &amp; Parole">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mots &amp; Parole</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: o app ocupa a altura da janela. Três telas: índice do caderno, ajustes e a página de jogo. Só o miolo de cada tela rola; a grade do jogo se ajusta ao espaço livre. */
:root{
  --bg0:#f4f5f7; --surface0:#ffffff; --surface20:#e7eaf0; --line0:#c9d0db; --grid0:#6f798b;
  --ink:#141a24; --muted:#4d5869; --accent:#1f3d7a; --on-accent:#ffffff;
  --ok:#17663f; --bad:#b3261e;
  --g1:#e2bd62; --g2:#86bfaa; --g3:#a1acdc; --g4:#dc9494; --g5:#d4a2cc; --on-g:#141a24;
  --bg:color-mix(in srgb,var(--accent) 4%,var(--bg0));
  --surface:color-mix(in srgb,var(--accent) 2%,var(--surface0));
  --surface-2:color-mix(in srgb,var(--accent) 8%,var(--surface20));
  --line:color-mix(in srgb,var(--accent) 12%,var(--line0));
  --grid:color-mix(in srgb,var(--accent) 22%,var(--grid0));
  --soft:color-mix(in srgb,var(--accent) 26%,var(--surface));
  --radius:8px; --bw:1px;
  --font-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --font-title:var(--font-display);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-appmode="light"]){
    --bg0:#0d1117; --surface0:#1a2230; --surface20:#283449; --line0:#43506a; --grid0:#98a6bc;
    --ink:#f1f4f9; --muted:#b0bacb; --accent:#8fa9e8; --on-accent:#0d1117; --ok:#6fcf9f; --bad:#ff8f85; color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-appmode="dark"]{
  --bg0:#0d1117; --surface0:#1a2230; --surface20:#283449; --line0:#43506a; --grid0:#98a6bc;
  --ink:#f1f4f9; --muted:#b0bacb; --accent:#8fa9e8; --on-accent:#0d1117; --ok:#6fcf9f; --bad:#ff8f85; color-scheme:dark;
}
:root[data-appmode="light"]{
  --bg0:#f4f5f7; --surface0:#ffffff; --surface20:#e7eaf0; --line0:#c9d0db; --grid0:#6f798b;
  --ink:#141a24; --muted:#4d5869; --accent:#1f3d7a; --on-accent:#ffffff; --ok:#17663f; --bad:#b3261e; color-scheme:light;
}
:root[data-layout="soft"]{--radius:18px;--font-title:var(--font-body)}
:root[data-layout="sharp"]{--radius:3px;--bw:2px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{height:100%;max-width:880px;margin-inline:auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:var(--bw) solid var(--line)}
.bar h1,.bar h2{margin:0;font-family:var(--font-title);font-weight:600;line-height:1.15}
.bar h1{font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:-.01em}
.bar h2{font-size:1.15rem}
.brand .fr{color:var(--accent)} .brand i{font-style:normal;color:var(--muted);margin-inline:.1em}
.sub,.step{margin:0;color:var(--muted);font-size:.9rem}
.ttl{flex:1;min-width:0}
.ttl .step{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:6px}
.right .btn{min-height:44px;padding:6px 10px;font-size:.92rem}
.ttl h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{flex:none;margin:0;padding:6px 16px;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:var(--bw) solid var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.foot{flex:none;padding:12px 16px;border-top:var(--bw) solid var(--line)}
.credit{margin:8px 0 0;text-align:center;color:var(--muted);font-size:.9rem;min-height:1.4em}
.lead{margin:0 0 16px;color:var(--muted);max-width:60ch}

.btn{min-height:48px;padding:8px 16px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%}
.btn.icon{min-width:48px;padding:8px;display:grid;place-items:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row .btn{flex:1;min-width:0;padding-inline:6px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 32px}
.stack{display:grid;gap:20px;align-content:start}
.lab{margin:0 0 8px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface)}
.seg button{flex:1;min-height:44px;border:0;border-radius:calc(var(--radius) - 2px);background:transparent;font-weight:700;cursor:pointer;padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--grid);cursor:pointer;padding:0;display:grid;place-items:center;font-size:.7rem;font-weight:700}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.swlabel{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.custom{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:700}
.custom input{width:56px;height:44px;padding:2px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface)}
.field{width:100%;min-height:48px;padding:8px 12px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface)}

/* Jogo */
.stage{flex:1;min-height:0;position:relative;margin:4px 6px}
.fit{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;max-width:100%;max-height:100%}
.cgrid{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:2px}
.cx{width:var(--cell);height:var(--cell);border-radius:calc(var(--radius)/3);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.cl{position:relative;width:var(--cell);height:var(--cell);display:flex;flex-direction:column;background:var(--g1);color:var(--on-g);border:max(var(--bw),1.5px) solid var(--grid);border-radius:calc(var(--radius)/3);overflow:hidden}
.ct{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:0 5px 0 2px;text-align:center;font-size:max(7px,calc(var(--cell)*.2));line-height:1.02;font-weight:700;overflow:hidden;word-break:break-word;cursor:pointer}
.cl.two .ct{font-size:max(6.5px,calc(var(--cell)*.17))}
.ct+.ct{border-top:1px solid color-mix(in srgb,var(--on-g) 35%,transparent)}
.ct.h::after{content:"▸";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:max(8px,calc(var(--cell)*.24))}
.ct.v::after{content:"▾";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);font-size:max(8px,calc(var(--cell)*.24))}
.ct.sel{background:var(--accent);color:var(--on-accent)}
.ct.ok{opacity:.5}
.cc,.wc{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;background:var(--surface);border:max(var(--bw),1.5px) solid var(--grid);border-radius:calc(var(--radius)/2);font-weight:700;font-size:calc(var(--cell)*.52);line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none}
.cc .n{position:absolute;top:1px;left:3px;font-size:max(9px,calc(var(--cell)*.28));font-weight:700;color:var(--muted);line-height:1}
.cc.inword{background:var(--soft)}
.cc.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cc.active .n{color:inherit}
.cc.wrong{background:color-mix(in srgb,var(--bad) 40%,var(--surface))}
.cc.given,.cc.rev{color:var(--accent)}
.cc.active.given,.cc.active.rev{color:var(--on-accent)}
.wc{font-size:calc(var(--cell)*.5)}
.wc.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wc.f1{background:var(--g1);color:var(--on-g)}.wc.f2{background:var(--g2);color:var(--on-g)}.wc.f3{background:var(--g3);color:var(--on-g)}.wc.f4{background:var(--g4);color:var(--on-g)}.wc.f5{background:var(--g5);color:var(--on-g)}
.wc.rev{outline:3px solid var(--accent);outline-offset:-3px}
.wgrid{touch-action:none}
.stage.zoom{overflow:auto;-webkit-overflow-scrolling:touch}
.stage.zoom .fit{position:relative;inset:auto;max-width:none;max-height:none;margin:0 auto}
.stage.zoom .wgrid{touch-action:pan-x pan-y}
.zbt{margin-right:6px}
.dock{flex:none;padding:6px 16px 12px;display:grid;gap:8px}
.status{margin:0;min-height:1.4em;font-weight:700;color:var(--muted);font-size:.95rem;text-align:center}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.clue{display:flex;align-items:center;gap:8px}
.clue-txt{flex:1;min-width:0;padding:6px 12px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);min-height:56px;display:flex;flex-direction:column;justify-content:center}
.clue-txt b{color:var(--accent)}
.clue-txt small{color:var(--muted);font-size:.85rem}
.kb{display:grid;gap:6px;margin:0 -8px}
.kb div{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:52px;min-height:54px;font-size:1.3rem;padding:0;border:var(--bw) solid var(--grid);border-radius:calc(var(--radius)/1.5);background:var(--surface);font-weight:700;cursor:pointer}
.kb button.del{max-width:72px}
.wlist{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;max-height:26vh;overflow-y:auto}
.wlist li{display:flex;align-items:center;gap:6px;padding:4px 10px;border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:.92rem}
.wlist .t{color:var(--muted)}
.wlist li.found{border-color:transparent;color:var(--on-g)}
.wlist li.found .t{color:inherit}
.wlist li.f1{background:var(--g1)}.wlist li.f2{background:var(--g2)}.wlist li.f3{background:var(--g3)}.wlist li.f4{background:var(--g4)}.wlist li.f5{background:var(--g5)}
.cstage{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{min-height:clamp(54px,9vh,80px);padding:6px 4px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);font-weight:700;font-size:clamp(.8rem,3.6vw,1rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;overflow-wrap:anywhere;cursor:pointer}
.tile small{font-weight:400;color:var(--muted);font-size:.78rem}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile[aria-pressed="true"] small{color:inherit}
.band{border-radius:var(--radius);padding:10px 14px;color:var(--on-g)}
.band h3{margin:0 0 4px;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase}
.band ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 14px}
.band li{display:flex;align-items:center;gap:2px}
.band small{opacity:.8}
.band.g1{background:var(--g1)}.band.g2{background:var(--g2)}.band.g3{background:var(--g3)}.band.g4{background:var(--g4)}.band.g5{background:var(--g5)}
.speak{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.no-speech .speak{display:none}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,8,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-body{width:100%;max-width:880px;max-height:82%;display:flex;flex-direction:column;background:var(--bg);border:var(--bw) solid var(--grid);border-radius:var(--radius) var(--radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-body header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:var(--bw) solid var(--line)}
.sheet-body h2{margin:0;flex:1;font-family:var(--font-title);font-size:1.2rem}
.sheet-in{overflow-y:auto;padding:12px 16px;display:grid;gap:6px}
.srow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:left;width:100%;cursor:pointer}
.srow .n{font-weight:700;color:var(--accent);min-width:2.6em}
.srow .pt{flex:1;min-width:0}
.srow .w{font-weight:700;color:var(--ok)}
.sh{margin:8px 0 2px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sheet-foot{display:flex;gap:8px;padding:12px 16px;border-top:var(--bw) solid var(--line)}
.sheet-foot .btn{flex:1}

/* Índice do caderno */
.vol{margin:0;font-family:var(--font-title);font-weight:500;font-size:1.05rem;color:var(--muted)}
.toc-sec{margin-top:22px}
.toc-sec:first-of-type{margin-top:18px}
.toc-sec .lab{padding-bottom:6px;border-bottom:var(--bw) solid var(--grid)}
.toc{display:grid}
.toc-row{display:flex;flex-direction:column;gap:0;width:100%;min-height:56px;padding:8px 2px;border:0;border-bottom:var(--bw) solid var(--line);background:transparent;text-align:left;cursor:pointer}
.toc-row:hover{background:var(--soft)}
.toc-row .l1{display:flex;align-items:baseline;gap:8px;width:100%}
.toc-row b{font-family:var(--font-title);font-size:1.15rem;font-weight:600}
.toc-row small{color:var(--muted);font-size:.85rem}
.toc-row .dots{flex:1;min-width:12px;border-bottom:2px dotted var(--grid);transform:translateY(-.35em);align-self:center}
.toc-row .st{flex:none;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);font-weight:700}
.toc-row .pg{flex:none;min-width:2.8em;text-align:right;font-family:var(--font-title);font-size:1.05rem;color:var(--muted)}
.sub{margin:14px 0 2px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.filters .flt{display:grid;gap:4px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.filters .flt.one{grid-column:1/-1}
.flt[hidden]{display:none}
.filters select.field{text-transform:none;letter-spacing:0;font-weight:400;font-size:1rem;color:var(--ink,inherit)}
.empty{margin:18px 0;color:var(--muted)}
.lopt.long{font-weight:400;font-size:1rem;text-align:left;justify-content:flex-start;line-height:1.35}
.avatar{flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--on-accent);width:var(--av,56px);height:var(--av,56px);font-family:var(--font-title);font-weight:600;font-size:calc(var(--av,56px)*.46)}
.avatar svg{width:58%;height:58%}
.me{display:flex;align-items:center;gap:14px;padding:12px 0 4px}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-family:var(--font-title);font-size:1.3rem;font-weight:600;line-height:1.15}
.me .who small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{margin:10px 0 0;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface)}
.stats summary{list-style:none;cursor:pointer;min-height:48px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.stats summary::-webkit-details-marker{display:none}
.stats summary small{font-weight:400;color:var(--muted)}
.stats summary::after{content:"▾";color:var(--muted)}
.stats[open] summary::after{content:"▴"}
.stats .in{padding:4px 14px 14px;display:grid;gap:14px;border-top:var(--bw) solid var(--line)}
.stats h3{margin:10px 0 6px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid div{padding:8px 6px;border:var(--bw) solid var(--line);border-radius:var(--radius);text-align:center}
.sgrid b{display:block;font-family:var(--font-title);font-size:1.4rem;line-height:1.1}
.sgrid small{color:var(--muted);font-size:.8rem}
.bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent)}
.train{display:grid;gap:6px}
.train .tr{display:flex;align-items:center;gap:8px;padding:6px 8px;border:var(--bw) solid var(--line);border-radius:var(--radius)}
.train .tr span{flex:1;min-width:0}
.train .tr small{color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.avgrid button{padding:6px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.avgrid button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.credit a{color:inherit}
.help{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.linkbtn{margin-top:8px}

/* Tecla extra e toggle do teclado */
.strip-row{flex:none;display:flex;align-items:center;gap:8px;border-bottom:var(--bw) solid var(--line)}
.strip-row .strip{flex:1;min-width:0;border-bottom:0}
.kbt{flex:none;margin-right:12px;min-height:34px;padding:2px 10px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer}
.native{position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0}

/* Tremor discreto em resposta errada */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .4s ease-in-out}
@media (prefers-reduced-motion:reduce){
  .shake{animation:none;outline:3px solid var(--bad);outline-offset:2px}
}

/* Conversação */
.sstage,.ostage{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.said{margin:0;padding:10px 14px;border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--surface)}
.said small{display:block;color:var(--muted)}
.prompt{margin:0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 var(--radius) var(--radius) 0;font-family:var(--font-title);font-size:1.15rem}
.prompt small{display:block;font-family:var(--font-body);font-size:.85rem;color:var(--muted)}
.slot{min-height:64px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border:var(--bw) dashed var(--grid);border-radius:var(--radius);background:var(--surface)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.blk{min-height:46px;padding:6px 14px;border:var(--bw) solid var(--grid);border-radius:var(--radius);background:var(--surface);font-weight:700;font-size:1.05rem;cursor:pointer}
.slot .blk{background:var(--soft);border-color:var(--accent)}
.blk.used{visibility:hidden}
.note{margin:0;padding:10px 14px;border:var(--bw) solid var(--line);border-radius:var(--radius);color:var(--muted);font-size:.92rem}
.note b{color:var(--ink)}
.heard{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ok)}

/* O Intruso */

  <section class="screen" id="s-index">

const VOCAB={},POOL={};

  for(const cat in RAW[lang]){

function full(it){return it.a?(it.a.endsWith("'")?it.a+it.w:it.a+" "+it.w):it.w;}
function genSearch(items,size,dirs,letters){
  const sorted=items.slice().sort((a,b)=>b.s.length-a.s.length);
  for(let attempt=0;attempt<80;attempt++){
    const g=Array.from({length:size},()=>Array(size).fill(""));
    const placed=[];let ok=true;
    for(const it of sorted){
      let done=false;
      for(let t=0;t<300&&!done;t++){
        const d=dirs[rnd(dirs.length)],dr=d[0],dc=d[1],L=it.s.length;
        const r0=rnd(size),c0=rnd(size),r1=r0+dr*(L-1),c1=c0+dc*(L-1);
        if(r1<0||r1>=size||c1<0||c1>=size)continue;
        let fits=true;
        for(let i=0;i<L;i++){const ch=g[r0+dr*i][c0+dc*i];if(ch&&ch!==it.s[i]){fits=false;break;}}
        if(!fits)continue;
        const cells=[];
        for(let i=0;i<L;i++){g[r0+dr*i][c0+dc*i]=it.s[i];cells.push([r0+dr*i,c0+dc*i]);}
        placed.push({it:it,cells:cells});done=true;
      }
      if(!done){ok=false;break;}
    }
    if(ok){
      for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!g[r][c])g[r][c]=letters[rnd(letters.length)];
      return {grid:g,placed:placed,size:size};
    }
  }
  return null;
}

function makeCrossword(items,span,tries){
  const W=items.filter(it=>it.s.length>=3);
  let best=null,bestScore=-1e9;
  for(let t=0;t<(tries||600);t++){
    const order=shuffle(W);
    let mi=0;order.forEach((x,i)=>{if(x.s.length>order[mi].s.length)mi=i;});
    const first=order.splice(mi,1)[0];
    const cells=new Map(),placed=[];
    const bb={a:0,b:0,c:0,d:0};
    const can=(x,r,c,d)=>{
      const dr=d,dc=1-d,L=x.s.length;
      if(Math.max(bb.b,r+dr*(L-1))-Math.min(bb.a,r)>span-1||Math.max(bb.d,c+dc*(L-1))-Math.min(bb.c,c)>span-1)return -1;
      if(cells.has(key(r-dr,c-dc))||cells.has(key(r+dr*L,c+dc*L)))return -1;
      let cross=0;
      for(let i=0;i<L;i++){
        const rr=r+dr*i,cc=c+dc*i,ex=cells.get(key(rr,cc));
        if(ex){
          if(ex.ch!==x.s[i])return -1;
          if(d===0?ex.h:ex.v)return -1;
          cross++;
        }else if(cells.has(key(rr+dc,cc+dr))||cells.has(key(rr-dc,cc-dr)))return -1;
      }
      return cross;
    };
    const put=(x,r,c,d)=>{
      const dr=d,dc=1-d;
      for(let i=0;i<x.s.length;i++){
        const k=key(r+dr*i,c+dc*i),ex=cells.get(k)||{ch:x.s[i],h:false,v:false};
        if(d===0)ex.h=true;else ex.v=true;
        cells.set(k,ex);
      }
      bb.a=Math.min(bb.a,r);bb.b=Math.max(bb.b,r+dr*(x.s.length-1));bb.c=Math.min(bb.c,c);bb.d=Math.max(bb.d,c+dc*(x.s.length-1));
      placed.push({it:x,r:r,c:c,d:d});
    };
    put(first,0,0,0);
    for(const x of order){
      let cands=[],bestCross=0;
      for(const p of placed){
        for(let i=0;i<x.s.length;i++)for(let j=0;j<p.it.s.length;j++){
          if(x.s[i]!==p.it.s[j])continue;
          let r,c,d;
          if(p.d===0){d=1;r=p.r-i;c=p.c+j;}else{d=0;r=p.r+j;c=p.c-i;}
          const cr=can(x,r,c,d);
          if(cr>=1){if(cr>bestCross){bestCross=cr;cands=[];}if(cr===bestCross)cands.push([r,c,d]);}
        }
      }
      if(cands.length){const pick=cands[rnd(cands.length)];put(x,pick[0],pick[1],pick[2]);}
    }
    let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
    cells.forEach((v,k)=>{const p=k.split(",").map(Number);minR=Math.min(minR,p[0]);maxR=Math.max(maxR,p[0]);minC=Math.min(minC,p[1]);maxC=Math.max(maxC,p[1]);});
    const area=(maxR-minR+1)*(maxC-minC+1);
    const score=placed.length*40-area;
    if(score>bestScore){bestScore=score;best={placed:placed.slice(),cells:cells,minR:minR,minC:minC,rows:maxR-minR+1,cols:maxC-minC+1};}
  }
  const entries=best.placed.map(p=>{
    const L=p.it.s.length,r=p.r-best.minR,c=p.c-best.minC;
    return {it:p.it,d:p.d,r:r,c:c,cells:Array.from({length:L},(_,i)=>[r+(p.d?i:0),c+(p.d?0:i)])};
  });
  const starts=Array.from(new Set(entries.map(e=>key(e.r,e.c)))).sort((a,b)=>{
    const x=a.split(",").map(Number),y=b.split(",").map(Number);return x[0]-y[0]||x[1]-y[1];
  });
  const sol={};
  entries.forEach(e=>{e.num=starts.indexOf(key(e.r,e.c))+1;e.cells.forEach((cell,i)=>{sol[key(cell[0],cell[1])]=e.it.s[i];});});
  return {rows:best.rows,cols:best.cols,entries:entries,sol:sol,nums:Object.fromEntries(starts.map((k,i)=>[k,i+1]))};
}

function pickWords(lang,cat,n,minL,maxL){
  const ok=it=>it.s.length>=minL&&it.s.length<=maxL;
  const out=[],seen=new Set();
  const add=list=>{for(const it of shuffle(list.filter(ok))){if(out.length>=n)return;if(!seen.has(it.s)){seen.add(it.s);out.push(it);}}};
  const everything=()=>Object.values(VOCAB[lang]).flat();
  if(cat==="all"){add(everything());return out;}
  add(VOCAB[lang][cat]);
  if(out.length<n){const g=CATS.find(c=>c[0]===cat)[2];add(CATS.filter(c=>c[2]===g&&c[0]!==cat).flatMap(c=>VOCAB[lang][c[0]]));}
  if(out.length<n)add(everything());
  return out;
}

const TYPES=[["cross","Palavras cruzadas","Cruzadas"],["search","Caça-palavras","Caça-palavras"],["connect","Conecte os grupos","Conecte"],["odd","O Intruso","Intruso"]];

function buildVol1(){
  const pages=[],cnt={};
  const add=p=>{cnt[p.type]=(cnt[p.type]||0)+1;p.n=cnt[p.type];pages.push(p);};
  ["cross","search"].forEach(t=>{
    CATS.forEach(c=>LEVELS.forEach(l=>add({id:t+"-"+c[0]+"-"+l,type:t,level:l,cat:c[0],themes:[c[0]],sub:c[1],meta:c[1]+" · "+LVN[l]})));
    LEVELS.forEach(l=>add({id:t+"-mix-"+l,type:t,level:l,cat:"all",themes:[],sub:"Mistura de temas",meta:"Mistura de temas · "+LVN[l]}));
  });
  GROUPS.concat([["all","Todos os temas"]]).forEach(g=>{
    const th=g[0]==="all"?[]:CATS.filter(c=>c[2]===g[0]).map(c=>c[0]);
    LEVELS.forEach(l=>[1,2,3].forEach(v=>add({id:"connect-"+g[0]+"-"+l+"-"+v,type:"connect",level:l,sec:g[0],themes:th,sub:g[1],meta:g[1]+" · "+LVN[l]+" · "+v})));
  });
  CATS.forEach(c=>add({id:"odd-"+c[0],type:"odd",main:c[0],cats:[c[0]],themes:[c[0]],sub:c[1],meta:c[1]}));
  [["comida","animais","cidade","roupas"],["corpo","casa","cores","verbos"],["familia","trabalho","clima","natureza"],[]].forEach((cs,i)=>add({id:"odd-mix-"+(i+1),type:"odd",cats:cs,themes:[],sub:"Mistura de temas",meta:cs.length?cs.map(k=>CATTXT[k]).join(", "):"Todos os temas"}));
  return pages;
}

const FRASES={
 fr:[
  [{s:"Je ne parle pas anglais.",pt:"Eu não falo inglês.",note:"A negação tem duas partes: «ne» antes do verbo e «pas» depois dele."},
   {s:"Elle a une petite voiture.",pt:"Ela tem um carrinho.",note:"Adjetivos curtos e muito usados (petit, grand, bon, beau) vêm antes do substantivo."},
   {s:"Il habite dans une maison blanche.",pt:"Ele mora numa casa branca.",note:"A cor vem depois do substantivo e concorda com ele: «blanche» porque «maison» é feminino."},
   {s:"Où habites-tu"+NB+"?",pt:"Onde você mora?",note:"A pergunta com inversão coloca o pronome depois do verbo, ligado por hífen: habites-tu."}],
  [{s:"Les enfants sont contents.",pt:"As crianças estão contentes.",note:"O adjetivo concorda em número: enfants (plural) pede «contents» com -s."},
   {s:"Elle est allée au marché.",pt:"Ela foi ao mercado.",note:"Com o verbo «être», o particípio concorda com o sujeito: allée (feminino). «Au» = à + le."},
   {s:"Il y a du pain sur la table.",pt:"Há pão na mesa.",note:"«Du» (de + le) é o artigo partitivo, usado para quantidade não contável. «Il y a» = há."},
   {s:"Voici mon frère et ma sœur.",pt:"Aqui estão meu irmão e minha irmã.",note:"O possessivo concorda com a coisa possuída: «mon» (masculino), «ma» (feminino)."}]],
 it:[
  [{s:"Non parlo inglese.",pt:"Eu não falo inglês.",note:"A negação é simples: «non» antes do verbo."},
   {s:"Ho una macchina rossa.",pt:"Eu tenho um carro vermelho.",note:"A cor vem depois do substantivo e concorda com ele: «rossa» (feminino) para «macchina»."},
   {s:"Tu abiti a Milano"+NB+"?",pt:"Você mora em Milão?",note:"A pergunta tem a mesma ordem da afirmação; só muda a entonação. Também se omite o «tu» com frequência."},
   {s:"È una bella città.",pt:"É uma bela cidade.",note:"«Bello» vem antes do substantivo e muda de forma: «bella» com um nome feminino. O acento em «È» o diferencia de «e» (e)."}],
  [{s:"Vado al mercato.",pt:"Eu vou ao mercado.",note:"«Al» = a + il: preposição articulada, que une preposição e artigo."},
   {s:"Le ragazze sono stanche.",pt:"As garotas estão cansadas.",note:"No plural feminino: artigo «le», substantivo em -e e adjetivo concordando (stanche)."},
   {s:"Mi piace il caffè.",pt:"Eu gosto de café.",note:"«Piacere» funciona ao contrário: o café agrada a mim. O verbo concorda com a coisa de que se gosta."},
   {s:"C'è del pane sul tavolo.",pt:"Há pão na mesa.",note:"«C'è» = ci + è (há). «Del» = di + il (partitivo) e «sul» = su + il."}]],
 en:[
  [{s:"I do not speak French.",pt:"Eu não falo francês.",note:"A negação no presente usa o auxiliar «do» + «not» antes do verbo principal."},
   {s:"She has a small red car.",pt:"Ela tem um carrinho vermelho.",note:"Adjetivos vêm antes do substantivo e não mudam de gênero; em geral, tamanho antes da cor."},
   {s:"Where do you live"+NB+"?",pt:"Onde você mora?",note:"Pergunta com palavra interrogativa: where + do + sujeito + verbo."},
   {s:"He always drinks coffee in the morning.",pt:"Ele sempre toma café de manhã.",note:"Advérbios de frequência (always, never, often) vão antes do verbo principal. «Drinks» leva -s na 3ª pessoa."}],
  [{s:"There is some bread on the table.",pt:"Há pão na mesa.",note:"«There is» = há. «Some» acompanha substantivos não contáveis, como bread."},
   {s:"My friends are very tired.",pt:"Meus amigos estão muito cansados.",note:"O plural fica só no substantivo (friends); o adjetivo «tired» não muda."},
   {s:"I like coffee, but she likes tea.",pt:"Eu gosto de café, mas ela gosta de chá.",note:"Na 3ª pessoa do singular do presente, o verbo ganha -s: she likes."},

  {s:"Bien sûr, voici la carte. Vous désirez boire quelque chose"+NB+"?",pt:"Claro, aqui está o cardápio. O senhor deseja beber alguma coisa?",note:"«La carte» é o cardápio; «le menu» é o conjunto de preço fixo (entrada, prato, sobremesa). «Quelque chose» = alguma coisa."},
  {s:"De l'eau, s'il vous plaît, et le plat du jour.",pt:"Água, por favor, e o prato do dia.",note:"«De l'eau» é o partitivo (de + la + eau). «Le plat du jour» é o prato do dia, muito comum nos restaurantes franceses."},
  {s:"Très bien. Et comme dessert"+NB+"?",pt:"Muito bem. E de sobremesa?",note:"«Comme» aqui significa «de/como»: comme dessert = de sobremesa."}],
 [{s:"Bonjour, j'ai réservé une chambre au nom de Silva.",pt:"Bom dia, eu reservei um quarto em nome de Silva.",note:"«J'ai réservé» é o passé composé (avoir + particípio): ação já feita. «Au nom de» = em nome de."},
  {s:"Oui, c'est pour combien de nuits"+NB+"?",pt:"Sim, é por quantas noites?",note:"«Combien de» + substantivo = quantos/quantas: combien de nuits."},
  {s:"C'est pour trois nuits, avec le petit-déjeuner.",pt:"É por três noites, com café da manhã.",note:"«Le petit-déjeuner» é o café da manhã. O almoço é «le déjeuner» e o jantar, «le dîner»."},
  {s:"Voici votre clé. La chambre est au deuxième étage.",pt:"Aqui está sua chave. O quarto fica no segundo andar.",note:"Na França o térreo é «le rez-de-chaussée»; o «premier étage» é o primeiro andar acima do térreo."}],
 [{s:"Bonjour, j'ai mal à la tête depuis hier.",pt:"Bom dia, estou com dor de cabeça desde ontem.",note:"«Avoir mal à» + parte do corpo: à la tête (à + la). Com masculino: mal au dos (à + le). «Depuis» = desde."},
  {s:"Vous avez de la fièvre"+NB+"?",pt:"A senhora tem febre?",note:"«De la fièvre» é o partitivo. Perguntar só com a entonação (sem inversão) é muito comum na fala."},
  {s:"Non, mais je me sens fatigué.",pt:"Não, mas me sinto cansado.",note:"«Se sentir» é reflexivo: je me sens. O adjetivo concorda com quem fala: fatigué (homem), fatiguée (mulher)."},
  {s:"Prenez ce médicament deux fois par jour, après les repas.",pt:"Tome este remédio duas vezes por dia, depois das refeições.",note:"«Prenez» é o imperativo de «prendre» na forma de «vous». «Deux fois par jour» = duas vezes por dia."}],
 [{s:"Allô, bonjour, je voudrais parler à Monsieur Martin.",pt:"Alô, bom dia, eu queria falar com o senhor Martin.",note:"«Allô» só se usa ao telefone. «Parler à» = falar com."},
  {s:"Je suis désolée, il n'est pas là en ce moment.",pt:"Sinto muito, ele não está aqui no momento.",note:"«Désolée» tem -e porque quem fala é uma mulher. «Il n'est pas là» = ele não está (ne ... pas, com ne reduzido a n')."},
  {s:"Pouvez-vous lui dire que Paul a appelé"+NB+"?",pt:"A senhora pode dizer a ele que o Paul ligou?",note:"«Lui dire» = dizer a ele; «lui» vem antes do infinitivo. «A appelé» é o passé composé de appeler: ligou."},
  {s:"Bien sûr, il vous rappellera demain.",pt:"Claro, ele ligará de volta para o senhor amanhã.",note:"«Rappellera» é o futur simple de rappeler (ligar de volta): a terminação -ra marca o futuro para «il»."}],
 [{s:"Bonjour, à la gare, s'il vous plaît.",pt:"Bom dia, à estação, por favor.",note:"Para dar o destino basta «à» + lugar: à la gare. «S'il vous plaît» deixa o pedido educado."},
  {s:"Très bien. Vous êtes pressé"+NB+"?",pt:"Muito bem. O senhor está com pressa?",note:"«Pressé» = apressado; «être pressé» = ter pressa."},
  {s:"Oui, mon train part dans vingt minutes.",pt:"Sim, meu trem sai em vinte minutos.",note:"«Dans» + tempo = daqui a (dans vingt minutes). Não confunda com «en», que indica a duração de uma ação."},
  {s:"Ne vous inquiétez pas, nous arrivons dans dix minutes.",pt:"Não se preocupe, chegamos em dez minutos.",note:"«Ne vous inquiétez pas» é o imperativo negativo: ne + verbo + pas. «Nous arrivons» = chegamos/estamos chegando."}],
 [{s:"Quel temps fait-il aujourd'hui"+NB+"?",pt:"Como está o tempo hoje?",note:"Para o clima usa-se «faire»: il fait beau, il fait froid. Literalmente: que tempo faz."},
  {s:"Il fait beau, mais il y a du vent.",pt:"O tempo está bom, mas tem vento.",note:"«Il y a du vent» = há vento. «Mais» = mas. «Beau» = bonito/bom (falando do tempo)."},
  {s:"Il va pleuvoir demain, je crois.",pt:"Vai chover amanhã, eu acho.",note:"«Aller» + infinitivo forma o futuro próximo: il va pleuvoir. «Je crois» = eu acho/creio."},
  {s:"Alors je prends mon parapluie.",pt:"Então eu levo meu guarda-chuva.",note:"«Alors» = então. «Prendre» também significa levar consigo. «Parapluie» = para + pluie."}]
);

const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function isDark(){
  if(S.mode==="dark")return true;
  if(S.mode==="light")return false;
  const t=document.documentElement.dataset.theme;
  if(t==="dark")return true;
  if(t==="light")return false;
  return !!(mq&&mq.matches);
}
function hexRgb(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function lum(h){const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function toHsl(h){
  const a=hexRgb(h).map(v=>v/255),r=a[0],g=a[1],b=a[2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let hh=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60;}
  return [hh,s,l];
}
function fromHsl(h,s,l){
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,"0");};
  return "#"+f(0)+f(8)+f(4);
}
function applyTheme(){
  const root=document.documentElement,dark=isDark();
  if(S.mode==="auto")root.removeAttribute("data-appmode");else root.setAttribute("data-appmode",S.mode);
  root.setAttribute("data-layout",S.layout);
  let acc;
  if(S.pal==="auto")acc=AUTO_ACC[S.lang][dark?1:0];
  else if(S.pal==="custom"){const h=toHsl(S.custom);acc=fromHsl(h[0],Math.min(h[1],.85),dark?Math.max(h[2],.66):Math.min(h[2],.36));}
  else acc=dark?PALS[S.pal].d:PALS[S.pal].l;
  root.style.setProperty("--accent",acc);
  root.style.setProperty("--on-accent",lum(acc)<.19?"#ffffff":"#0d1117");
}

let AC=null;
const TONES={
  ok:[[523.25,0,.12,"sine"],[659.25,.09,.18,"sine"]],
  done:[[523.25,0,.13,"sine"],[659.25,.1,.13,"sine"],[783.99,.2,.3,"sine"]],
  bad:[[196,0,.16,"triangle"],[155.56,.1,.22,"triangle"]]
};
function sfx(kind){
  if(S.sound!=="on")return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime+.01;
    TONES[kind].forEach(n=>{
      const o=AC.createOscillator(),g=AC.createGain(),s=t0+n[1];
      o.type=n[3];o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(kind==="bad"?.07:.05,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+n[2]);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+n[2]+.05);
    });
  }catch(_){}
}
function shake(el){
  if(!el)return;
  el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),450);
}

function fitGrid(cols,rows,gap,minC,maxC){

  sel.innerHTML='<option value="all">Todos os temas</option>'+GROUPS.filter(g=>CATS.some(c=>c[2]===g[0])).map(g=>'<optgroup label="'+esc(g[1])+'">'+CATS.filter(c=>c[2]===g[0]).map(c=>'<option value="'+c[0]+'">'+esc(c[1])+"</option>").join("")+"</optgroup>").join("");
}
function renderIndex(){
  const V=curVol();
  $("#vol-title").textContent=V.title;
  const num={};V.pages.forEach((p,i)=>{num[p.id]=i+1;});
  $("#f-theme").value=S.fTheme;$("#f-level").value=S.fLevel;
  $("#f-level-w").hidden=S.vol!==1;
  $("#filters").classList.toggle("one",S.vol!==1);
  $("#f-theme-w").classList.toggle("one",S.vol!==1);
  let shown=0;
  const html=V.types.map(t=>{
    const pages=V.pages.filter(p=>p.type===t[0]&&pageShown(p));
    if(!pages.length)return "";
    let last=null;
    const rows=pages.map(p=>{
      shown++;
      let sub="";
      if(p.sub&&p.sub!==last&&S.fTheme==="all"){sub='<h3 class="sub">'+esc(p.sub)+"</h3>";}
      last=p.sub;
      return sub+'<button type="button" class="toc-row" data-id="'+p.id+'"><span class="l1"><b>'+pageTitle(p)+'</b><span class="dots"></span>'+(isDone(p)?'<span class="st">Concluído</span>':"")+'<span class="pg">p. '+num[p.id]+'</span></span><small>'+esc(pageMeta(p))+"</small></button>";
    }).join("");
    return '<section class="toc-sec"><h2 class="lab">'+t[1]+'</h2><div class="toc">'+rows+"</div></section>";
  }).join("");
  $("#toc").innerHTML=html||'<p class="empty">Nenhuma página com esse tema neste volume. Escolha outro tema ou outro volume.</p>';
  $("#toc-help").textContent=shown+" de "+V.pages.length+" páginas. Cada página é fixa, como num livro impresso. Toque em uma para jogar.";
  syncPrefs();
  renderStats();
}
$("#toc").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)startPage(b.dataset.id);});

function onFilter(e){
  if(e.target.id==="f-theme")S.fTheme=e.target.value;else if(e.target.id==="f-level")S.fLevel=e.target.value;else return;

function vocabSet(){const set=new Set();Object.values(VOCAB[S.lang]).flat().forEach(it=>set.add(it.w.toLowerCase()));return set;}

  const doneN=Object.keys(S.done).filter(k=>k.indexOf(L+":")===0).length;

  let mastered=0;Object.keys(sk).forEach(k=>{if(vs.has(k)&&sk[k][0]>=2&&sk[k][0]>sk[k][1])mastered++;});
  const total=Object.values(pl).reduce((a,b)=>a+b,0);

/* ===== Palavras cruzadas ===== */
const cw={cred:new Set(),missed:new Set(),clueEls:[],p:null,order:[],map:{},vals:{},given:{},wrong:{},rev:{},cells:{},ei:0,cur:null,dir:0,finished:false,cfg:null};
const kk=x=>key(x[0],x[1]);
function entryKeys(e){return e.cells.map(kk);}
function entrySolved(e){return entryKeys(e).every(k=>cw.vals[k]===cw.p.sol[k]);}
function curEntry(){return cw.order[cw.ei];}
const shortClue=pt=>pt.split(/\s*[\/;]\s*/)[0].replace(/\s*\(.*?\)/g,"").trim();
/* layout "brasileiro": cada dica fica numa casa antes da palavra, com seta; a grade ganha 1 linha e 1 coluna de margem */
function swedish(p){
  const sol={},clues={};
  Object.keys(p.sol).forEach(k=>{const a=k.split(",").map(Number);sol[key(a[0]+1,a[1]+1)]=p.sol[k];});
  p.entries.forEach(e=>{
    e.r+=1;e.c+=1;e.cells=e.cells.map(x=>[x[0]+1,x[1]+1]);
    const ck=e.d?key(e.r-1,e.c):key(e.r,e.c-1);
    (clues[ck]=clues[ck]||{})[e.d?"v":"h"]=e;
  });
  return {entries:p.entries,sol:sol,nums:{},clues:clues,rows:p.rows+1,cols:p.cols+1};
}
function creditAll(){
  cw.order.forEach(e=>{
    if(cw.cred.has(e)||!entrySolved(e))return;
    cw.cred.add(e);
    if(entryKeys(e).every(k=>!cw.rev[k]))skRec(e.it.w,e.it.pt,true);
  });
}
function missEntry(e){if(cw.missed.has(e)||cw.cred.has(e))return;cw.missed.add(e);skRec(e.it.w,e.it.pt,false);}

function startCross(){
  const c=CFG.cross[P.level];cw.cfg=c;seedNow();
  let p=null;
  for(let at=0;at<10;at++){
    if(at)seedWith(S.lang+"|"+curVol().id+"|"+P.id+"#"+at);
    const q=makeCrossword(pickWords(S.lang,P.cat,c.n,3,c.max),c.span,c.tries);
    if(!p||q.entries.length>p.entries.length)p=q;
    if(p.entries.length>=Math.ceil(c.n*.75))break;
  }
  p=swedish(p);
  cw.cred=new Set();cw.missed=new Set();cw.clueEls=[];
  cw.p=p;cw.finished=false;cw.vals={};cw.given={};cw.wrong={};cw.rev={};cw.cells={};cw.map={};
  p.entries.forEach(e=>e.cells.forEach(x=>{const k=kk(x);(cw.map[k]=cw.map[k]||{})[e.d]=e;}));
  cw.order=p.entries.slice().sort((a,b)=>a.num-b.num||a.d-b.d);
  if(c.given){
    const ks=shuffle(Object.keys(p.sol));
    ks.slice(0,Math.round(ks.length*c.given)).forEach(k=>{cw.vals[k]=p.sol[k];cw.given[k]=1;});
  }
  const fit=$("#fit");fit.className="fit cgrid";fit.style.setProperty("--cols",p.cols);fit.innerHTML="";
  for(let r=0;r<p.rows;r++)for(let q=0;q<p.cols;q++){
    const k=key(r,q);
    if(p.sol[k]){
      const d=document.createElement("div");d.className="cc";d.dataset.k=k;
      d.appendChild(document.createElement("span"));
      fit.appendChild(d);cw.cells[k]=d;
    }else if(p.clues[k]){
      const cl=document.createElement("div"),m=p.clues[k];cl.className="cl"+(m.h&&m.v?" two":"");
      ["h","v"].forEach(t=>{
        if(!m[t])return;
        const sp=document.createElement("span");sp.className="ct "+t;sp.dataset.ei=cw.order.indexOf(m[t]);
        sp.textContent=shortClue(m[t].it.pt);cl.appendChild(sp);cw.clueEls.push([sp,m[t]]);
      });
      fit.appendChild(cl);
    }else fit.insertAdjacentHTML("beforeend",'<div class="cx"></div>');
  }
  fitFn=()=>fitGrid(p.cols,p.rows,2,18,72);fitFn();
  setStatus("#cw-status","");
  const first=cw.order.findIndex(e=>!entrySolved(e));
  selectEntry(first<0?0:first);
}
function selectEntry(i,k){
  cw.ei=i;const e=cw.order[i];cw.dir=e.d;
  if(!k){const ks=entryKeys(e);k=ks.find(x=>!cw.vals[x])||ks.find(x=>cw.vals[x]!==cw.p.sol[x])||ks[0];}
  cw.cur=k;paintCross();
}
function selectCell(k){
  const m=cw.map[k];if(!m)return;
  let d=cw.dir;
  if(cw.cur===k&&m[0]&&m[1])d=1-d;else if(!m[d])d=m[0]?0:1;
  cw.dir=d;cw.ei=cw.order.indexOf(m[d]);cw.cur=k;paintCross();
}
function paintCross(){
  const e=curEntry(),inw=new Set(entryKeys(e));
  Object.keys(cw.cells).forEach(k=>{
    const d=cw.cells[k];
    d.className="cc"+(inw.has(k)?" inword":"")+(k===cw.cur?" active":"")+(cw.wrong[k]?" wrong":"")+(cw.given[k]?" given":"")+(cw.rev[k]?" rev":"");
    d.lastChild.textContent=cw.vals[k]||"";
  });
  cw.clueEls.forEach(x=>{x[0].classList.toggle("sel",x[1]===e);x[0].classList.toggle("ok",cw.finished||entrySolved(x[1]));});
  const art=cw.cfg.article&&e.it.a?" · artigo: "+e.it.a:"";
  const solved=cw.finished||entrySolved(e);
  followActive();
  $("#cw-clue").innerHTML="<span><b>"+(e.d?"↓ Vertical":"→ Horizontal")+"</b> "+esc(e.it.pt)+"</span><small>"+plural(e.it.s.length,"letra","letras")+esc(art)+(solved?" · "+esc(full(e.it)):"")+"</small>";
}
function afterSolve(){
  const n=cw.order.length;
  for(let s=1;s<=n;s++){const j=(cw.ei+s)%n;if(!entrySolved(cw.order[j])){selectEntry(j);checkDone();return;}}
  paintCross();checkDone();
}
function checkDone(){
  if(cw.finished||!cw.order.every(entrySolved))return;
  cw.finished=true;paintCross();markDone();sfx("done");
  setStatus("#cw-status","Página concluída. Veja as palavras e as traduções.","ok");
  setTimeout(()=>doneSheet("Página concluída: palavras",cw.order.map(e=>e.it)),400);
}
function typeLetter(ch){
  if(cw.finished||!cw.cur)return;
  const k=cw.cur,ks=entryKeys(curEntry()),i=ks.indexOf(k);
  if(!cw.given[k]){cw.vals[k]=ch;delete cw.wrong[k];delete cw.rev[k];}
  setStatus("#cw-status","");
  creditAll();
  if(entrySolved(curEntry())){sfx("ok");afterSolve();return;}
  if(i<ks.length-1)cw.cur=ks[i+1];
  paintCross();checkDone();
}
function backspace(){
  if(cw.finished||!cw.cur)return;
  const k=cw.cur,ks=entryKeys(curEntry()),i=ks.indexOf(k);
  const clear=x=>{if(!cw.given[x]){delete cw.vals[x];delete cw.wrong[x];delete cw.rev[x];}};
  if(!cw.given[k]&&cw.vals[k])clear(k);
  else if(i>0){cw.cur=ks[i-1];clear(ks[i-1]);}
  setStatus("#cw-status","");
  paintCross();
}
function focusNative(){
  if(S.kb||$("#s-game").hidden||!P||P.type!=="cross")return;
  const n=$("#native");n.value="";try{n.focus({preventScroll:true});}catch(_){}
}
$("#native").addEventListener("input",e=>{
  const v=e.target.value;e.target.value="";
  Array.from(v).forEach(c=>{const ch=norm(c);if(ch.length===1)typeLetter(ch);});
});
function stepEntry(d){const n=cw.order.length;selectEntry((cw.ei+d+n)%n);}
function hintLetter(){
  if(cw.finished)return;
  const sol=cw.p.sol,ks=entryKeys(curEntry());
  let k=(cw.cur&&cw.vals[cw.cur]!==sol[cw.cur])?cw.cur:ks.find(x=>cw.vals[x]!==sol[x]);
  if(!k)k=Object.keys(sol).find(x=>cw.vals[x]!==sol[x]);
  if(!k)return;
  cw.vals[k]=sol[k];delete cw.wrong[k];cw.rev[k]=1;
  setStatus("#cw-status","Letra revelada.");
  if(entrySolved(curEntry())){creditAll();afterSolve();}else{paintCross();checkDone();}
}
function checkLetters(){
  if(cw.finished)return;
  let wrong=0,empty=0;
  Object.keys(cw.cells).forEach(k=>{
    delete cw.wrong[k];
    if(!cw.vals[k])empty++;else if(cw.vals[k]!==cw.p.sol[k]){cw.wrong[k]=1;wrong++;}
  });
  cw.order.forEach(e=>{if(entryKeys(e).some(k=>cw.wrong[k]))missEntry(e);});
  paintCross();
  if(wrong){
    sfx("bad");$$(".cc.wrong").forEach(shake);
    setStatus("#cw-status",plural(wrong,"letra errada marcada","letras erradas marcadas")+" em vermelho.","bad");
  }
  else setStatus("#cw-status",empty?"Nenhuma letra errada. Faltam "+plural(empty,"casa","casas")+".":"Tudo certo!","ok");
}
function revealAll(){
  if(cw.finished)return;
  Object.keys(cw.cells).forEach(k=>{if(cw.vals[k]!==cw.p.sol[k])cw.rev[k]=1;cw.vals[k]=cw.p.sol[k];delete cw.wrong[k];});
  cw.order.forEach(e=>missEntry(e));
  cw.finished=true;paintCross();
  setStatus("#cw-status","Respostas reveladas. A página não é marcada como concluída.");
  openSheet("Respostas",cw.order.map(e=>wordRow(e.it)).join(""),true);
}
function openClues(){

const ws={p:null,found:new Map(),cells:[],anchor:null,hover:null,dragging:false,tap:false,cfg:null};
function startSearch(){
  const c=CFG.search[P.level];ws.cfg=c;seedNow();
  const words=pickWords(S.lang,P.cat,c.n,3,c.maxLen);
  let p=null,n=words.length;
  while(!p&&n>=4){p=genSearch(words.slice(0,n),c.size,c.dirs,POOL[S.lang]);if(!p)n--;}
  ws.p=p;ws.found=new Map();ws.anchor=ws.hover=null;ws.dragging=ws.tap=false;ws.cells=[];
  const fit=$("#fit");fit.className="fit cgrid wgrid";fit.style.setProperty("--cols",p.size);fit.innerHTML="";
  for(let r=0;r<p.size;r++){
    ws.cells[r]=[];
    for(let q=0;q<p.size;q++){
      const d=document.createElement("div");d.className="wc";d.dataset.r=r;d.dataset.c=q;d.textContent=p.grid[r][q];
      fit.appendChild(d);ws.cells[r][q]=d;
    }
  }
  fitFn=()=>fitGrid(p.size,p.size,2,18,60);fitFn();
  setStatus("#ws-status","Arraste sobre as letras, ou toque na primeira e na última.");
  renderWsList();
}
function renderWsList(){
  $("#ws-list").innerHTML=ws.p.placed.map((p,i)=>{
    const it=p.it;
    if(ws.found.has(i))return '<li class="found f'+ws.found.get(i)+'"><b>'+esc(full(it))+'</b><span class="t">'+esc(it.pt)+"</span>"+speakBtn(full(it))+"</li>";
    if(ws.cfg.showTr)return "<li><b>"+esc(it.w)+'</b><span class="t">'+esc(it.pt)+"</span></li>";
    return '<li><span class="t">'+esc(it.pt)+"</span><small>"+it.s.length+" letras</small></li>";
  }).join("");
}
function lineCells(a,b,size){
  const dr=b.r-a.r,dc=b.c-a.c,adr=Math.abs(dr),adc=Math.abs(dc);
  if(!adr&&!adc)return [a];
  let sr,sc,len;
  if(adr>=2*adc){sr=Math.sign(dr);sc=0;len=adr;}
  else if(adc>=2*adr){sr=0;sc=Math.sign(dc);len=adc;}
  else{sr=Math.sign(dr);sc=Math.sign(dc);len=Math.max(adr,adc);}
  const out=[];
  for(let i=0;i<=len;i++){const r=a.r+sr*i,c=a.c+sc*i;if(r<0||c<0||r>=size||c>=size)break;out.push({r:r,c:c});}
  return out;
}
function clearSel(){$$("#fit .sel").forEach(c=>c.classList.remove("sel"));}
function paintSel(){
  clearSel();if(!ws.anchor)return;
  lineCells(ws.anchor,ws.hover||ws.anchor,ws.p.size).forEach(x=>ws.cells[x.r][x.c].classList.add("sel"));
}
function finishSel(){
  const cells=lineCells(ws.anchor,ws.hover,ws.p.size);
  ws.anchor=ws.hover=null;ws.tap=false;ws.dragging=false;clearSel();
  if(cells.length<2)return;
  const str=cells.map(x=>ws.p.grid[x.r][x.c]).join(""),rev=str.split("").reverse().join("");
  const hit=p=>p.it.s===str||p.it.s===rev;
  const idx=ws.p.placed.findIndex((p,i)=>!ws.found.has(i)&&hit(p));
  if(idx>=0){
    const col=ws.found.size%5+1;ws.found.set(idx,col);
    cells.forEach(x=>{const el=ws.cells[x.r][x.c];el.classList.remove("f1","f2","f3","f4","f5","rev");el.classList.add("f"+col);});
    const it=ws.p.placed[idx].it,total=ws.p.placed.length;
    skRec(it.w,it.pt,true);
    renderWsList();
    if(ws.found.size===total){
      markDone();sfx("done");
      setStatus("#ws-status","Página concluída. "+full(it)+" = "+it.pt+".","ok");
      setTimeout(()=>doneSheet("Página concluída: palavras",ws.p.placed.map(p=>p.it)),500);
    }else{sfx("ok");setStatus("#ws-status","Achou: "+full(it)+" = "+it.pt+" ("+ws.found.size+" de "+total+").","ok");}
  }else if(ws.p.placed.some((p,i)=>ws.found.has(i)&&hit(p)))setStatus("#ws-status","Você já encontrou essa palavra.");
  else{sfx("bad");shake($("#fit"));setStatus("#ws-status","Essa sequência não está na lista. Tente de novo.","bad");}
}
function cellAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest(".wc");
  return c?{r:+c.dataset.r,c:+c.dataset.c}:null;
}
const fitEl=$("#fit");
const zoomed=()=>$("#stage").classList.contains("zoom");
/* ampliado: a grade rola com o dedo, então a seleção é por toque (primeira e última letra) */
fitEl.addEventListener("click",e=>{
  if(!P||P.type!=="search"||!ws.p||!zoomed())return;
  const c=e.target.closest(".wc");if(!c)return;
  const cell={r:+c.dataset.r,c:+c.dataset.c};
  if(ws.anchor){ws.hover=cell;finishSel();return;}
  ws.anchor=cell;ws.hover=cell;ws.tap=true;paintSel();
  setStatus("#ws-status","Agora toque na última letra da palavra.");
});
fitEl.addEventListener("pointerdown",e=>{
  if(!P||P.type!=="search"||!ws.p||zoomed())return;
  const cell=cellAt(e);if(!cell)return;
  e.preventDefault();
  if(ws.tap&&ws.anchor){ws.hover=cell;finishSel();return;}
  ws.anchor=cell;ws.hover=cell;ws.dragging=true;ws.tap=false;
  try{fitEl.setPointerCapture(e.pointerId);}catch(_){}
  paintSel();
});
fitEl.addEventListener("pointermove",e=>{
  if(!P||P.type!=="search"||!ws.dragging||zoomed())return;
  const cell=cellAt(e);
  if(cell&&(cell.r!==ws.hover.r||cell.c!==ws.hover.c)){ws.hover=cell;paintSel();}
});
fitEl.addEventListener("pointerup",()=>{
  if(!P||P.type!=="search"||!ws.dragging||zoomed())return;
  ws.dragging=false;
  if(ws.hover.r===ws.anchor.r&&ws.hover.c===ws.anchor.c){ws.tap=true;paintSel();}else finishSel();
});
fitEl.addEventListener("pointercancel",()=>{if(ws.tap&&!ws.dragging)return;ws.dragging=false;ws.anchor=ws.hover=null;ws.tap=false;clearSel();});
$("#ws-reveal").addEventListener("click",()=>{

});

/* ===== Conecte ===== */
const cn={groups:[],tiles:[],sel:new Set(),solved:[],mistakes:0,done:false,cfg:null};
const CLASH=[["pessoas","familia"],["comida","restaurante"],["clima","natureza"],["saude","corpo"],["trabalho","laboratorio"]];
const clashes=(a,b)=>CLASH.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
function startConnect(){
  const c=CFG.connect[P.level];cn.cfg=c;seedNow();
  let keys=CATS.filter(x=>x[2]===P.sec).map(x=>x[0]);
  if(keys.length<c.groups)keys=CATS.map(x=>x[0]);
  const pool=shuffle(keys),cats=[];
  pool.forEach(k=>{if(cats.length<c.groups&&!cats.some(o=>clashes(o,k)))cats.push(k);});
  pool.forEach(k=>{if(cats.length<c.groups&&cats.indexOf(k)<0)cats.push(k);});
  cn.groups=cats.map(cat=>({cat:cat,label:CATLABEL[cat],items:shuffle(VOCAB[S.lang][cat]).slice(0,4)}));
  let id=0;
  cn.tiles=shuffle(cn.groups.flatMap((g,gi)=>g.items.map(it=>({id:id++,it:it,gi:gi}))));
  cn.sel=new Set();cn.solved=[];cn.mistakes=0;cn.done=false;
  fitFn=null;
  renderConnect();cnSay("Escolha 4 palavras do mesmo tema.");
}
function cnSay(msg,kind){setStatus("#cn-status",msg+" ("+cn.solved.length+" de "+cn.groups.length+" grupos)",kind);}
function renderConnect(){
  $("#cn-solved").innerHTML=cn.solved.map((gi,n)=>{
    const g=cn.groups[gi];
    return '<div class="band g'+(n%5+1)+'" style="margin-bottom:8px"><h3>'+esc(g.label)+"</h3><ul>"+g.items.map(it=>"<li><b>"+esc(full(it))+"</b><small> "+esc(it.pt)+"</small>"+speakBtn(full(it))+"</li>").join("")+"</ul></div>";
  }).join("");
  $("#cn-grid").innerHTML=cn.tiles.filter(t=>cn.solved.indexOf(t.gi)<0).map(t=>'<button type="button" class="tile" data-id="'+t.id+'" aria-pressed="'+cn.sel.has(t.id)+'"><span>'+esc(t.it.w)+"</span>"+(cn.cfg.showTr?"<small>"+esc(t.it.pt)+"</small>":"")+"</button>").join("");
  $("#cn-submit").disabled=cn.sel.size!==4||cn.done;
}
$("#cn-grid").addEventListener("click",e=>{
  const b=e.target.closest(".tile");if(!b||cn.done)return;
  const id=+b.dataset.id;
  if(cn.sel.has(id))cn.sel.delete(id);else if(cn.sel.size<4)cn.sel.add(id);
  renderConnect();
});
$("#cn-submit").addEventListener("click",()=>{
  if(cn.sel.size!==4||cn.done)return;
  const picked=cn.tiles.filter(t=>cn.sel.has(t.id)),counts={};
  picked.forEach(t=>{counts[t.gi]=(counts[t.gi]||0)+1;});
  const top=Math.max.apply(null,Object.values(counts));
  if(top===4){
    picked.forEach(t=>skRec(t.it.w,t.it.pt,true));
    const gi=picked[0].gi;cn.solved.push(gi);cn.sel=new Set();renderConnect();
    if(cn.solved.length===cn.groups.length){
      cn.done=true;markDone();sfx("done");cnSay("Página concluída.","ok");renderConnect();
      setTimeout(()=>doneSheet("Página concluída: palavras",cn.groups.flatMap(g=>g.items)),500);
    }else{sfx("ok");cnSay("Certo! Tema: "+cn.groups[gi].label+".","ok");}
  }else{
    const maj=+Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
    picked.forEach(t=>{if(t.gi!==maj)skRec(t.it.w,t.it.pt,false);});
    cn.mistakes++;renderConnect();sfx("bad");$$("#cn-grid .tile[aria-pressed=true]").forEach(shake);
    cnSay(top===3?"Quase! 3 dessas palavras são do mesmo tema.":"Essas 4 palavras não formam um grupo.","bad");
  }
});
$("#cn-shuffle").addEventListener("click",()=>{cn.tiles=shuffle(cn.tiles);renderConnect();});
$("#cn-clear").addEventListener("click",()=>{cn.sel=new Set();renderConnect();});
$("#cn-hint").addEventListener("click",()=>{

/* ===== Conversação (monte a frase) ===== */
const sn={lines:[],i:0,words:[],bank:[],slot:[],solved:false,doneLines:0};
function startSentence(){
  seedNow();
  sn.fr=P.type==="frases";sn.lines=(sn.fr?FRASES:DIALOGS)[S.lang][P.n-1];sn.i=0;sn.doneLines=0;fitFn=null;
  loadLine();
}
function loadLine(){
  const l=sn.lines[sn.i];
  sn.words=l.s.split(" ");
  sn.bank=shuffle(sn.words.map((w,id)=>({id:id,w:w})));
  if(sn.words.length>1&&sn.bank.every((b,k)=>b.w===sn.words[k]))sn.bank.reverse();
  sn.slot=[];sn.solved=false;sn.bad=false;
  renderSentence();
  setStatus("#sn-status","Toque nas palavras para montar a frase, na ordem certa.");
}
function renderSentence(){
  const l=sn.lines[sn.i],spk=sn.i%2===0?"A":"B";
  const prev=sn.i>0&&!sn.fr?'<p class="said"><small>Fala anterior</small>'+esc(sn.lines[sn.i-1].s)+"</p>":"";
  let h=prev+'<p class="prompt"><small>'+(sn.fr?"Frase ":"Fala ")+(sn.i+1)+" de "+sn.lines.length+(sn.fr?" · monte em ":" · pessoa "+spk+" diz, em ")+LNAME[S.lang]+":</small>"+esc(l.pt)+"</p>";
  h+='<div class="slot" id="sn-slot" aria-label="Sua frase">'+sn.slot.map(b=>'<button type="button" class="blk" data-un="'+b.id+'">'+esc(b.w)+"</button>").join("")+"</div>";
  const used=new Set(sn.slot.map(b=>b.id));
  h+='<div class="bank" id="sn-bank">'+sn.bank.map(b=>'<button type="button" class="blk'+(used.has(b.id)?" used":"")+'" data-w="'+b.id+'"'+(used.has(b.id)?" tabindex=-1 aria-hidden=true":"")+">"+esc(b.w)+"</button>").join("")+"</div>";
  if(sn.solved)h+='<div class="heard">'+speakBtn(l.s)+'<span>'+esc(l.s)+'</span></div><p class="note"><b>Nota:</b> '+esc(l.note)+"</p>";
  $("#sstage").innerHTML=h;
  $("#sn-submit").disabled=sn.solved||sn.slot.length!==sn.words.length;
  $("#sn-clear").disabled=sn.solved||!sn.slot.length;
  $("#sn-next").disabled=!sn.solved;
  $("#sn-next").textContent=sn.i===sn.lines.length-1?(sn.fr?"Ver frases":"Ver diálogo"):(sn.fr?"Próxima frase":"Próxima fala");
}
$("#sstage").addEventListener("click",e=>{
  if(sn.solved)return;
  const w=e.target.closest("[data-w]"),u=e.target.closest("[data-un]");
  if(w){const b=sn.bank.find(x=>x.id===+w.dataset.w);if(b&&!sn.slot.includes(b))sn.slot.push(b);}
  else if(u){sn.slot=sn.slot.filter(x=>x.id!==+u.dataset.un);}
  else return;
  renderSentence();
});
$("#sn-clear").addEventListener("click",()=>{if(sn.solved)return;sn.slot=[];renderSentence();});
$("#sn-submit").addEventListener("click",()=>{
  if(sn.solved||sn.slot.length!==sn.words.length)return;
  const ok=sn.slot.every((b,k)=>b.w===sn.words[k]);
  if(ok){
    sn.solved=true;sn.doneLines++;sfx("ok");
    if(!sn.bad){skRec(sn.lines[sn.i].s,sn.lines[sn.i].pt,true);}
    renderSentence();
    setStatus("#sn-status","Certo!","ok");
    speak(sn.lines[sn.i].s);
  }else{
    if(!sn.bad){sn.bad=true;skRec(sn.lines[sn.i].s,sn.lines[sn.i].pt,false);}
    sfx("bad");shake($("#sn-slot"));
    setStatus("#sn-status","Ainda não. Toque numa palavra da frase para tirá-la e reordene.","bad");
  }
});
$("#sn-next").addEventListener("click",()=>{
  if(!sn.solved)return;
  if(sn.i<sn.lines.length-1){sn.i++;loadLine();return;}
  markDone();sfx("done");
  openSheet(sn.fr?"Frases completas":"Diálogo completo",sn.lines.map(l=>'<div class="srow"><span class="pt"><b>'+esc(l.s)+"</b><br><small>"+esc(l.pt)+"</small></span>"+speakBtn(l.s)+"</div>").join(""),true);
  setStatus("#sn-status","Página concluída.","ok");
});

/* ===== O Intruso ===== */
const od={rounds:[],i:0,sel:null,solved:false,all:[]};
function startOdd(){
  seedNow();
  const R=5;od.rounds=[];od.all=[];
  if(P.main){
    /* página de um tema: três palavras do tema + um intruso de outro tema */
    const a=P.main,words=shuffle(VOCAB[S.lang][a]);
    const others=shuffle(CATS.map(c=>c[0]).filter(k=>k!==a&&!clashes(a,k)));
    for(let i=0;i<R;i++){
      const b=others[i%others.length];
      const three=words.slice(i*3,i*3+3);
      const intr=shuffle(VOCAB[S.lang][b]).find(x=>three.every(t=>t.s!==x.s))||VOCAB[S.lang][b][0];
      const tiles=shuffle(three.map(it=>({it:it,odd:false})).concat([{it:intr,odd:true}]));
      od.rounds.push({a:a,b:b,tiles:tiles});od.all.push(...three,intr);
    }
  }else{
    const keys=P.cats.length?P.cats:CATS.map(c=>c[0]);
    const order=shuffle(keys);
    for(let i=0;i<R;i++){
      const a=order[i%order.length];
      const pool=(P.cats.length>1?P.cats:CATS.map(c=>c[0])).filter(k=>k!==a&&!clashes(a,k));
      const others=shuffle(pool);
      const b=others[0];
      const three=shuffle(VOCAB[S.lang][a]).slice(0,3);
      const intr=shuffle(VOCAB[S.lang][b])[0];
      const tiles=shuffle(three.map(it=>({it:it,odd:false})).concat([{it:intr,odd:true}]));
      od.rounds.push({a:a,b:b,tiles:tiles});
      od.all.push(...three,intr);
    }
  }
  od.i=0;od.sel=null;od.solved=false;fitFn=null;
  renderOdd();
  setStatus("#od-status","Três palavras são do mesmo grupo. Qual é o intruso?");
}
function renderOdd(){
  const r=od.rounds[od.i];
  let h='<p class="ocount">Rodada '+(od.i+1)+" de "+od.rounds.length+"</p>";
  h+='<div class="ogrid">'+r.tiles.map((t,k)=>{
    const cls="otile"+(od.solved&&t.odd?" right":"");
    return '<button type="button" class="'+cls+'" data-k="'+k+'" aria-pressed="'+(od.sel===k)+'"'+(od.solved?" disabled":"")+"><span>"+esc(full(t.it))+"</span><small>"+esc(t.it.pt)+"</small></button>";
  }).join("")+"</div>";
  if(od.solved)h+='<p class="note">As outras três são de <b>'+esc(CATLABEL[r.a])+"</b>. <b>"+esc(full(r.tiles.find(t=>t.odd).it))+"</b> é de "+esc(CATLABEL[r.b])+".</p>";
  $("#ostage").innerHTML=h;
  $("#od-submit").disabled=od.solved||od.sel===null;
  $("#od-next").disabled=!od.solved;
  $("#od-next").textContent=od.i===od.rounds.length-1?"Terminar":"Próxima";
}
$("#ostage").addEventListener("click",e=>{
  const b=e.target.closest(".otile");if(!b||od.solved)return;
  od.sel=+b.dataset.k;renderOdd();
  const t=od.rounds[od.i].tiles[od.sel];speak(full(t.it));
});
$("#od-submit").addEventListener("click",()=>{
  if(od.solved||od.sel===null)return;
  const r=od.rounds[od.i];
  const oddIt=r.tiles.find(t=>t.odd).it;
  if(r.tiles[od.sel].odd){if(!r.bad)skRec(oddIt.w,oddIt.pt,true);od.solved=true;sfx("ok");renderOdd();setStatus("#od-status","Certo! Esse é o intruso.","ok");}
  else{if(!r.bad){r.bad=true;skRec(oddIt.w,oddIt.pt,false);}sfx("bad");shake($('#ostage .otile[aria-pressed="true"]'));setStatus("#od-status","Esse pertence ao grupo. Tente outra palavra.","bad");}
});
$("#od-next").addEventListener("click",()=>{
  if(!od.solved)return;
  if(od.i<od.rounds.length-1){od.i++;od.sel=null;od.solved=false;renderOdd();setStatus("#od-status","Três palavras são do mesmo grupo. Qual é o intruso?");return;}
  markDone();sfx("done");
  setStatus("#od-status","Página concluída.","ok");
  doneSheet("Página concluída: palavras",od.all);
});



/* ===== Volume 3: Qual resposta faz sentido? ===== */
const rs={lines:[],i:0,opts:[],sel:null,solved:false,said:[]};
function startResp(){
  seedNow();fitFn=null;
  rs.lines=DIALOGS[S.lang][P.n-1];rs.i=0;rs.said=[];
  loadResp();
}
function loadResp(){
  const l=rs.lines[rs.i];
  const others=shuffle(rs.lines.filter((x,k)=>k!==rs.i)).slice(0,2);
  rs.opts=shuffle([l].concat(others).map(x=>({x:x,ok:x===l})));
  rs.sel=null;rs.solved=false;rs.bad=false;
  renderResp();
  setStatus("#rs-status","Escolha a fala que faz mais sentido neste ponto da conversa.");
}
function renderResp(){
  const l=rs.lines[rs.i];
  let h='<p class="ocount">Fala '+(rs.i+1)+" de "+rs.lines.length+" · "+esc(P.meta)+"</p>";
  h+=rs.said.map((x,k)=>'<p class="said"><small>Pessoa '+(k%2===0?"A":"B")+"</small>"+esc(x.s)+"</p>").join("");
  h+='<p class="prompt"><small>Pessoa '+(rs.i%2===0?"A":"B")+" responde:</small>"+(rs.i===0?"Qual fala abre a conversa?":"Qual fala vem agora?")+"</p>";
  h+='<div class="lopts">'+rs.opts.map((o,k)=>'<button type="button" class="lopt long'+(rs.solved&&o.ok?" right":"")+'" data-k="'+k+'" aria-pressed="'+(rs.sel===k)+'"'+(rs.solved?" disabled":"")+">"+esc(o.x.s)+"</button>").join("")+"</div>";
  if(rs.solved)h+='<div class="heard">'+speakBtn(l.s)+"<span>"+esc(l.pt)+'</span></div><p class="note"><b>Nota:</b> '+esc(l.note)+"</p>";
  $("#rstage").innerHTML=h;
  $("#rs-submit").disabled=rs.solved||rs.sel===null;
  $("#rs-next").disabled=!rs.solved;
  $("#rs-next").textContent=rs.i===rs.lines.length-1?"Ver diálogo":"Próxima";
}
$("#rstage").addEventListener("click",e=>{
  if(!P||P.type!=="resposta"||rs.solved)return;
  const b=e.target.closest(".lopt");if(!b)return;
  rs.sel=+b.dataset.k;renderResp();
});
$("#rs-submit").addEventListener("click",()=>{
  if(rs.solved||rs.sel===null)return;
  if(rs.opts[rs.sel].ok){if(!rs.bad)skRec(rs.lines[rs.i].s,rs.lines[rs.i].pt,true);rs.solved=true;sfx("ok");renderResp();setStatus("#rs-status","Certo!","ok");speak(rs.lines[rs.i].s);}
  else{if(!rs.bad){rs.bad=true;skRec(rs.lines[rs.i].s,rs.lines[rs.i].pt,false);}sfx("bad");shake($('#rstage .lopt[aria-pressed="true"]'));setStatus("#rs-status","Ainda não. Releia o que já foi dito e tente outra fala.","bad");}
});
$("#rs-next").addEventListener("click",()=>{
  if(!rs.solved)return;
  rs.said.push(rs.lines[rs.i]);
  if(rs.i<rs.lines.length-1){rs.i++;loadResp();return;}
  markDone();sfx("done");
  openSheet("Diálogo completo",rs.lines.map(l=>'<div class="srow"><span class="pt"><b>'+esc(l.s)+"</b><br><small>"+esc(l.pt)+"</small></span>"+speakBtn(l.s)+"</div>").join(""),true);
  setStatus("#rs-status","Página concluída.","ok");
});

/* ===== Volume 2: estudo e teste de ouvido ===== */
const ls={phase:"study",items:[],pairs:[],rounds:[],i:0,sel:null,solved:false,all:[]};
const parts=(s,n)=>s.split("|");
function themeItems(L,cat){
  return VOCAB[L][cat].map(it=>{const pr=(PRON[L][it.w]||"|").split("|");return {w:full(it),bare:it.w,say:full(it),ipa:pr[0],pt:pr[1],tr:it.pt};});
}
function lev(a,b){
  const m=a.length,n=b.length;let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
function ditadoOpts(ans){
  const L=S.lang,ipa=w=>(PRON[L][w]||"").split("|")[0],seen=new Set([ans.bare]);
  const cand=shuffle(Object.values(VOCAB[L]).flat()).filter(x=>{
    if(seen.has(x.w)||ipa(x.w)===ipa(ans.bare)||norm(x.w)===norm(ans.bare))return false;
    seen.add(x.w);return true;
  });
  cand.sort((p,q)=>lev(p.w,ans.bare)-lev(q.w,ans.bare));
  const near=shuffle(cand.slice(0,5)).slice(0,3);
  return shuffle([{t:ans.bare,ok:true}].concat(near.map(x=>({t:x.w,ok:false}))));
}
function startListen(){
  seedNow();fitFn=null;
  const L=S.lang;
  ls.items=[];ls.pairs=[];
  if(P.type==="alfabeto"){
    ls.items=ALFA[L].slice((P.n-1)*13,P.n*13).map(r=>{const p=r.split("|");return {w:p[0],say:p[1],ipa:p[2],pt:p[3],tr:"nome da letra: "+p[1]};});
  }else if(P.type==="sons"){
    ls.pairs=SONS[L][P.n-1].map(r=>{const h=r.split("||").map(x=>x.split("|"));return h.map(p=>({w:p[0],say:p[0],ipa:p[1],pt:p[2],tr:p[3]}));});
    ls.items=ls.pairs.flat();
  }else if(P.type==="tema"||P.type==="ditado"){
    ls.items=themeItems(L,P.cat);
  }else{
    ls.items=FALA[L][P.n-1].map(r=>{const p=r.split("|");return {w:p[0],say:p[0],ipa:p[1],pt:p[2],tr:p[3]};});
  }
  ls.phase="study";
  if(P.type==="ditado"){startQuiz();return;}
  renderStudy();
}
function lsDock(){
  const study=ls.phase==="study";
  $("#ls-go").hidden=!study;
  ["#ls-submit","#ls-replay","#ls-next","#ls-study"].forEach(id=>{$(id).hidden=study;});
}
function ipaLine(it){return '<span class="ipa">/'+esc(it.ipa)+'/</span> <span class="how">'+esc(it.pt)+"</span>";}
function renderStudy(){
  lsDock();
  let h='<p class="note">'+esc(LEGENDA[S.lang])+(P.type==="tema"?" Aqui o IPA e o \"como fala\" valem para a palavra sem o artigo.":"")+"</p>";
  if(P.type==="sons"){
    h+=ls.pairs.map(pr=>'<div class="prow pair">'+pr.map(it=>'<div class="pcell"><b>'+esc(it.w)+"</b>"+speakBtn(it.say)+"<br>"+ipaLine(it)+"<br><small>"+esc(it.tr)+"</small></div>").join("")+"</div>").join("");
  }else{
    h+=ls.items.map(it=>'<div class="prow"><span class="big">'+esc(it.w)+'</span><span class="pc">'+ipaLine(it)+"<br><small>"+esc(P.type==="alfabeto"?"se diz «"+it.say+"»":it.tr)+"</small></span>"+speakBtn(it.say)+"</div>").join("");
  }
  $("#lstage").innerHTML=h;
  setStatus("#ls-status","Leia e ouça. Quando quiser, comece o teste de ouvido.");
}
$("#ls-go").addEventListener("click",startQuiz);
$("#ls-study").addEventListener("click",()=>{ls.phase="study";renderStudy();});
function startQuiz(){
  seedNow();
  const N=P.type==="tema"||P.type==="ditado"?8:6,items=ls.items;ls.rounds=[];ls.all=ls.items;
  if(P.type==="sons"){
    shuffle(ls.pairs.flatMap(pr=>pr.map(ans=>({pr:pr,ans:ans})))).forEach(x=>{
      ls.rounds.push({say:x.ans.say,ask:"Qual palavra você ouviu?",opts:shuffle(x.pr.map(it=>({t:it.w,ok:it===x.ans}))),ans:x.ans,show:x.pr});
    });
  }else if(P.type==="ditado"){
    shuffle(items).slice(0,N).forEach(ans=>{
      ls.rounds.push({say:ans.say,ask:"Como se escreve a palavra que você ouviu?",opts:ditadoOpts(ans),ans:ans,show:[ans]});
    });
  }else if(P.type==="tema"){
    shuffle(items).slice(0,N).forEach(ans=>{
      const seen=new Set([ans.tr]),others=shuffle(items.filter(x=>x!==ans)).filter(x=>{if(seen.has(x.tr))return false;seen.add(x.tr);return true;}).slice(0,2);
      ls.rounds.push({say:ans.say,ask:"Qual é o significado da palavra que você ouviu?",opts:shuffle([ans].concat(others).map(it=>({t:it.tr,ok:it===ans}))),ans:ans,show:[ans]});
    });
  }else{
    shuffle(items).slice(0,N).forEach(ans=>{
      const others=shuffle(items.filter(x=>x!==ans)).slice(0,P.type==="alfabeto"?3:2);
      const ask=P.type==="alfabeto"?"Qual letra você ouviu?":"Qual é o «como fala» da palavra que você ouviu?";
      const opts=shuffle([ans].concat(others).map(it=>({t:P.type==="alfabeto"?it.w:it.pt,ok:it===ans})));
      ls.rounds.push({say:ans.say,ask:ask,opts:opts,ans:ans,show:[ans]});
    });
  }
  ls.i=0;ls.sel=null;ls.solved=false;ls.phase="quiz";
  renderRound(true);
}
function renderRound(play){
  lsDock();
  const r=ls.rounds[ls.i];
  let h='<p class="ocount">Rodada '+(ls.i+1)+" de "+ls.rounds.length+'</p><p class="prompt">'+esc(r.ask)+'<small>Toque no alto-falante quantas vezes quiser.</small></p>';
  h+='<div class="heard bigspk">'+speakBtn(r.say)+"<span>Ouvir</span></div>";
  h+='<div class="lopts">'+r.opts.map((o,k)=>'<button type="button" class="lopt'+(ls.solved&&o.ok?" right":"")+'" data-k="'+k+'" aria-pressed="'+(ls.sel===k)+'"'+(ls.solved?" disabled":"")+">"+esc(o.t)+"</button>").join("")+"</div>";
  if(ls.solved)h+='<div class="note">'+r.show.map(it=>"<b>"+esc(it.w)+"</b> "+ipaLine(it)+" · "+esc(it.tr)).join("<br>")+"</div>";
  $("#lstage").innerHTML=h;
  $("#ls-submit").disabled=ls.solved||ls.sel===null;
  $("#ls-next").disabled=!ls.solved;
  $("#ls-next").textContent=ls.i===ls.rounds.length-1?"Terminar":"Próxima";
  if(play)speak(r.say);
}
$("#lstage").addEventListener("click",e=>{
  if(ls.phase!=="quiz"||ls.solved)return;
  const b=e.target.closest(".lopt");if(!b)return;
  ls.sel=+b.dataset.k;renderRound(false);
});
$("#ls-replay").addEventListener("click",()=>{if(ls.phase==="quiz")speak(ls.rounds[ls.i].say);});
$("#ls-submit").addEventListener("click",()=>{
  if(ls.solved||ls.sel===null)return;
  const r=ls.rounds[ls.i];
  if(r.opts[ls.sel].ok){if(!r.bad)skRec(r.ans.bare||r.ans.w,P.type==="alfabeto"?"letra "+r.ans.say:(r.ans.tr||r.ans.pt),true);ls.solved=true;sfx("ok");renderRound(false);setStatus("#ls-status","Certo!","ok");}
  else{if(!r.bad){r.bad=true;skRec(r.ans.bare||r.ans.w,P.type==="alfabeto"?"letra "+r.ans.say:(r.ans.tr||r.ans.pt),false);}sfx("bad");shake($('#lstage .lopt[aria-pressed="true"]'));setStatus("#ls-status","Ainda não. Ouça de novo e tente outra opção.","bad");}
});
$("#ls-next").addEventListener("click",()=>{
  if(!ls.solved)return;
  if(ls.i<ls.rounds.length-1){ls.i++;ls.sel=null;ls.solved=false;renderRound(true);setStatus("#ls-status","");return;}
  markDone();sfx("done");setStatus("#ls-status","Página concluída.","ok");
  openSheet("Página concluída: para rever",ls.all.map(it=>'<div class="srow"><span class="w">'+esc(it.w)+'</span><span class="pt">'+ipaLine(it)+"</span>"+speakBtn(it.say)+"</div>").join(""),true);
});

buildSettings();applyTheme();buildKb();go("index");
